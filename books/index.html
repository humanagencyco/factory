<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Books</title>
<style>
:root{--ink:#2b2250;--paper:#fff7ec;--pink:#ff6fa5;--sun:#ffc23d;--mint:#35d6a8;--sky:#55b4ff;--lilac:#b592ff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.4 "Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:44px;margin:4px 0 14px;letter-spacing:.5px}
button{font:inherit;font-weight:700;border:0;border-radius:24px;padding:14px 20px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 5px 0 rgba(43,34,80,.25)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,34,80,.25)}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.add{background:var(--pink);color:#fff;font-size:26px;border-radius:50px;padding:14px 26px}
.shelves{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 18px}
.tile{border-radius:26px;padding:18px 12px;text-align:center;font-size:22px;font-weight:700;color:#fff;box-shadow:0 6px 0 rgba(43,34,80,.22)}
.tile .e{display:block;font-size:44px;line-height:1.1}
.tile small{display:block;font-size:16px;opacity:.95;font-weight:700}
.t-reading{background:var(--sky)}.t-read{background:var(--mint)}.t-tb{background:var(--lilac)}.t-wish{background:var(--sun);color:var(--ink)}
.tile[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:3px}
.search{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:4px solid #e7dcf6;border-radius:24px;background:#fff;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:#fff;border-radius:22px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(43,34,80,.12);cursor:pointer}
.card img,.card .noc{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;background:#f1e7ff}
.card b{font-size:18px;line-height:1.2}
.card small{color:#6d6490;font-size:15px}
.stars{color:#d9d0ea;font-size:22px;letter-spacing:2px}
.stars .on{color:var(--sun)}
.empty{grid-column:1/-1;text-align:center;padding:30px;border-radius:26px;background:#fff;font-size:22px}
dialog{border:0;border-radius:28px;padding:0;max-width:580px;width:calc(100% - 24px);background:#fff;color:var(--ink);box-shadow:0 20px 50px rgba(43,34,80,.3)}
dialog::backdrop{background:rgba(43,34,80,.45)}
.sheet{padding:22px}
.sheet h2{margin:0 0 4px;font-size:28px}
.sheet .by{color:#6d6490;margin:0 0 12px;font-size:17px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sheet .row button.on{background:var(--mint)}
.sheet .row button.star{background:none;box-shadow:none;font-size:34px;padding:0 4px;color:#d9d0ea}
.sheet .row button.star.on{color:var(--sun)}
.sheet textarea{width:100%;min-height:90px;font:inherit;font-size:20px;border:4px solid #e7dcf6;border-radius:20px;padding:10px}
.sheet p.sum{font-size:17px;color:#4a4270}
.sheet .x{background:none;box-shadow:none;text-decoration:underline;color:#6d6490;font-size:17px}
.hits{display:grid;gap:10px;margin:12px 0}
.hit{display:flex;gap:12px;align-items:center;border-radius:20px;padding:10px;background:#f6f1ff}
.hit img{width:52px;height:76px;object-fit:cover;border-radius:8px}
.hit div{flex:1;font-size:18px}
.hit small{color:#6d6490}
.hit button{background:var(--mint)}
.foot{margin:26px 0 40px;text-align:center}
.foot button{font-size:16px;background:none;box-shadow:none;color:#6d6490;text-decoration:underline;padding:8px}
@media (max-width:460px){h1{font-size:36px}.shelves{gap:10px}.tile .e{font-size:36px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>📚 My Books</h1>
    <button class="add" id="addBtn" aria-label="Add a book">＋</button>
  </div>

  <div class="shelves" role="group" aria-label="Shelves">
    <button class="tile t-reading" data-s="reading" aria-pressed="false"><span class="e">📖</span>Reading<small id="n-reading"></small></button>
    <button class="tile t-read" data-s="read" aria-pressed="false"><span class="e">✅</span>Read<small id="n-read"></small></button>
    <button class="tile t-tb" data-s="tb" aria-pressed="false"><span class="e">🏫</span>To borrow<small id="n-tb"></small></button>
    <button class="tile t-wish" data-s="wish" aria-pressed="false"><span class="e">⭐</span>Wish list<small id="n-wish"></small></button>
  </div>

  <input class="search" id="find" type="search" placeholder="🔍 Find a book" aria-label="Find a book">
  <div class="grid" id="list" aria-live="polite"></div>

  <div class="foot">
    <button id="export">Save a copy</button>
    <label><button type="button" onclick="document.getElementById('import').click()">Get my copy back</button><input type="file" id="import" accept="application/json" hidden></label>
  </div>
</main>

<dialog id="add">
  <div class="sheet">
    <h2>Find a new book</h2>
    <p class="by">Type the name of the book, or the number under the barcode.</p>
    <input class="search" id="q" type="search" placeholder="Type here…" aria-label="Book name or number">
    <div class="row"><button class="add" id="go" style="font-size:22px">Find it</button></div>
    <div class="hits" id="hits" aria-live="polite"></div>
    <div class="row"><button class="x" id="closeAdd">Close</button></div>
  </div>
</dialog>

<dialog id="detail">
  <div class="sheet" id="detailBody"></div>
</dialog>
<script>
const KEY = "hu_books_v1";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const LABEL = { reading: "Reading", read: "Read", tb: "To borrow", wish: "Wish list" };
let state = { shelf: "reading", q: "", sort: "added", books: [] };
function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state.books)); } catch (e) {} }

async function summaryFor(workKey) {
  if (!workKey) return "";
  try { const d = await (await fetch(`https://openlibrary.org${workKey}.json`)).json(); const v = d.description; return (typeof v === "string" ? v : (v && v.value)) || ""; }
  catch (e) { return ""; }
}

const STOP = new Set(["the","of","a","an","and","in","to","for","on","with","book"]);
function keyWords(q) { return q.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w && !STOP.has(w)); }
// Small typo allowance: "flies" matches "fleas", "pilky" matches "pilkey" (words of 4+ letters, 2 changes at most)
function editDistance(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 99;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function wordMatches(w, titleWords) {
  return titleWords.some(t => t === w || (w.length >= 4 && editDistance(w, t) <= 2));
}
async function findBooks(q) {
  q = q.trim(); if (q.length < 2) return [];
  const isbn = q.replace(/[^0-9Xx]/g, "");
  const fields = "key,title,author_name,first_publish_year,isbn,number_of_pages_median,subject,cover_i,publisher,edition_count";
  if (/^(\d{10}|\d{13})$/.test(isbn)) {
    const d = await (await fetch(`https://openlibrary.org/search.json?isbn=${isbn}&limit=5&fields=${fields}`)).json();
    return toBooks(d.docs || [], isbn);
  }
  const words = keyWords(q);
  const enc = encodeURIComponent(q);
  const first = encodeURIComponent(words.slice(0, 2).join(" ") || q);
  // Three searches: the whole phrase, the phrase as a general search, and the first words (to catch series)
  const urls = [
    `https://openlibrary.org/search.json?title=${enc}&sort=editions&limit=40&fields=${fields}`,
    `https://openlibrary.org/search.json?q=${enc}&sort=editions&limit=40&fields=${fields}`,
    `https://openlibrary.org/search.json?title=${first}&sort=editions&limit=100&fields=${fields}`,
    `https://openlibrary.org/search.json?q=${encodeURIComponent(words.slice(0, 3).join(" ") || q)}&limit=100&fields=${fields}`,
  ];
  const results = await Promise.all(urls.map(u => fetch(u).then(r => r.json()).catch(() => ({ docs: [] }))));
  const seen = new Set(); const docs = [];
  for (const r of results) for (const x of (r.docs || [])) {
    const k = (x.title || "").toLowerCase() + "|" + ((x.author_name || [])[0] || "");
    if (!seen.has(k)) { seen.add(k); docs.push(x); }
  }
  // Rank by how many of the typed words the title matches (allowing small typos)
  const hitsOf = x => { const tw = (x.title || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean); return words.filter(w => wordMatches(w, tw)).length; };
  const need = Math.max(1, Math.ceil(words.length / 2));
  const ranked = docs.map(x => ({ x, h: hitsOf(x) })).filter(o => o.h >= need)
    .sort((a, b) => (b.h - a.h) || ((b.x.edition_count || 0) - (a.x.edition_count || 0)));
  return toBooks(ranked.slice(0, 8).map(o => o.x), "");
}
function toBooks(docs, isbnQuery) {
  return docs.map(x => ({
    title: x.title || "Untitled", author: (x.author_name || [])[0] || "Unknown author",
    year: x.first_publish_year || "", pages: x.number_of_pages_median || "",
    isbn: (x.isbn || []).find(i => i.length === 13) || (x.isbn || [])[0] || isbnQuery,
    genres: (x.subject || []).slice(0, 4), publisher: (x.publisher || [])[0] || "",
    cover: x.cover_i ? `https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg` : "",
    workKey: x.key || ""
  }));
}
async function summaryFor(workKey) {
  if (!workKey) return "";
  try {
    const d = await (await fetch(`https://openlibrary.org${workKey}.json`)).json();
    const v = d.description; return (typeof v === "string" ? v : (v && v.value)) || "";
  } catch (e) { return ""; }
}


function showHits(list) {
  $("hits").innerHTML = (list.length ? list.map((b, i) => `
    <div class="hit">
      ${b.cover ? `<img alt="" src="${esc(b.cover)}">` : ""}
      <div><b>${esc(b.title)}</b><br><small>${esc(b.author)}${b.year ? " · " + esc(b.year) : ""}</small></div>
      <button data-add="${i}">Add</button>
    </div>`).join("") : `<p>No books found. Try the author's name, or add it by hand.</p>`)
    + `<button id="byHand">Add by hand</button>`;
  $("hits").querySelectorAll("[data-add]").forEach(btn => btn.onclick = () => addBook(list[+btn.dataset.add]));
  $("byHand").onclick = () => {
    const title = prompt("Book title?"); if (!title) return;
    const author = prompt("Who wrote it?") || "Unknown author";
    addBook({ title: title.trim(), author: author.trim(), year: "", pages: "", isbn: "", genres: [], publisher: "", cover: "", workKey: "" });
  };
}

async function addBook(b) {
  const summary = await summaryFor(b.workKey);
  state.books.unshift({ id: String(Date.now()), ...b, summary, shelf: "tb", rating: 0, finished: "", notes: "", added: today() });
  save(); $("add").close(); $("hits").innerHTML = ""; $("q").value = ""; state.shelf = "tb"; render();
}

// What shows on the grid: the chosen shelf, filtered by search, newest first
function visible() {
  const q = state.q.toLowerCase();
  let list = state.books.filter(b => b.shelf === state.shelf);
  if (q) list = list.filter(b => [b.title, b.author, b.notes].join(" ").toLowerCase().includes(q));
  return list.sort((a, b) => ((b.finished || b.added || "") > (a.finished || a.added || "") ? 1 : -1));
}
function starsOf(n) { return `<span class="stars">${[1,2,3,4,5].map(i => `<span class="${i <= (n || 0) ? "on" : ""}">★</span>`).join("")}</span>`; }

function render() {
  document.querySelectorAll(".shelves button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === state.shelf)));
  ["reading","read","tb","wish"].forEach(k => { const el = $("n-" + k); if (el) el.textContent = "(" + state.books.filter(b => b.shelf === k).length + ")"; });
  const list = visible();
  $("list").innerHTML = list.length ? list.map(b => `
    <button class="card" data-open="${esc(b.id)}" aria-label="${esc(b.title)}">
      ${b.cover ? `<img alt="" src="${esc(b.cover)}">` : `<div class="noc"></div>`}
      <b>${esc(b.title)}</b>
      <small>${esc(b.author)}</small>
      ${starsOf(b.rating)}
    </button>`).join("")
    : `<div class="empty" style="grid-column:1/-1">${state.books.some(b => b.shelf === state.shelf) ? "Nothing matches your search." : "No books here yet. Tap + Add a book."}</div>`;
  $("list").querySelectorAll("[data-open]").forEach(btn => btn.onclick = () => openDetail(btn.dataset.open));
}

function openDetail(id) {
  const b = state.books.find(x => x.id === id); if (!b) return;
  const shelfBtns = ["reading","read","tb","wish"].map(k => `<button data-to="${k}" class="${b.shelf === k ? "on" : ""}">${LABEL[k]}</button>`).join("");
  const rate = [1,2,3,4,5].map(n => `<button class="star ${n <= (b.rating || 0) ? "on" : ""}" data-rate="${n}" aria-label="${n} stars">★</button>`).join("");
  $("detailBody").innerHTML = `
    <h2>${esc(b.title)}</h2>
    <p class="by">${esc(b.author)}${b.year ? " · " + esc(b.year) : ""}${b.pages ? " · " + esc(b.pages) + " pages" : ""}</p>
    ${b.summary ? `<p class="sum">${esc(b.summary.slice(0, 400))}${b.summary.length > 400 ? "…" : ""}</p>` : ""}
    <p><b>Put it on:</b></p>
    <div class="row">${shelfBtns}</div>
    <p><b>My rating:</b></p>
    <div class="row">${rate}</div>
    ${b.shelf === "read" ? `<p><b>Finished on:</b> <input type="date" id="fin" value="${esc(b.finished)}"></p>` : ""}
    <p><b>What did you think?</b></p>
    <textarea id="notes" placeholder="Tap here to write">${esc(b.notes)}</textarea>
    <div class="row"><button class="x" id="del">Remove this book</button><button id="done">Close</button></div>`;
  const change = fn => { fn(b); save(); openDetail(id); render(); };
  $("detailBody").querySelectorAll("[data-to]").forEach(btn => btn.onclick = () => change(x => { x.shelf = btn.dataset.to; if (x.shelf === "read" && !x.finished) x.finished = today(); }));
  $("detailBody").querySelectorAll("[data-rate]").forEach(btn => btn.onclick = () => change(x => { x.rating = +btn.dataset.rate; if (x.shelf !== "read") { x.shelf = "read"; x.finished = x.finished || today(); } }));
  if ($("fin")) $("fin").onchange = () => change(x => x.finished = $("fin").value);
  $("notes").onchange = () => { b.notes = $("notes").value; save(); };
  $("del").onclick = () => { if (confirm("Remove this book?")) { state.books = state.books.filter(x => x.id !== id); save(); $("detail").close(); render(); } };
  $("done").onclick = () => { b.notes = $("notes").value; save(); $("detail").close(); render(); };
  $("detail").showModal();
}

document.querySelectorAll(".shelves button").forEach(b => b.onclick = () => { state.shelf = b.dataset.s; render(); });
$("addBtn").onclick = () => { $("hits").innerHTML = ""; $("add").showModal(); $("q").focus(); };
$("closeAdd").onclick = () => $("add").close();
$("go").onclick = async () => {
  $("hits").innerHTML = "<p>Looking…</p>";
  try { showHits(await findBooks($("q").value)); } catch (e) { $("hits").innerHTML = "<p>Search isn't working right now. Try again in a moment.</p>"; }
};
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("go").click(); } });
$("find").oninput = e => { state.q = e.target.value; render(); };
$("export").onclick = () => {
  const blob = new Blob([JSON.stringify(state.books, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "my-books-" + today() + ".json"; a.click();
};
$("import").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const list = JSON.parse(await f.text()); if (Array.isArray(list)) { state.books = list; save(); render(); } else alert("That file isn't a books copy."); }
  catch (err) { alert("That file couldn't be read."); }
};

state.books = load();
render();
</script>
</body>
</html>
