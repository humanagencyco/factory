<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#24184a; --muted:#7a6fa0; --card:#ffffff; --line:#eee8fb;
  --g1:#ffe9f3; --g2:#e9f4ff; --g3:#f3ecff;
  --pink:#ff5e9c; --sky:#4aa8ff; --mint:#2fd0a0; --lilac:#9b7bff; --sun:#ffbe2e;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font:500 18px/1.45 "Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(900px 500px at 10% -10%,var(--g1),transparent 60%),radial-gradient(800px 500px at 110% 10%,var(--g2),transparent 60%),linear-gradient(180deg,var(--g3),#fbfaff 60%)}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--pink),var(--lilac));box-shadow:0 10px 24px rgba(155,123,255,.35)}
h1{margin:0;font-size:40px;font-weight:800;letter-spacing:-.5px}
.add{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:20px;color:#fff;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--lilac));box-shadow:0 10px 22px rgba(255,94,156,.35)}
.add:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--sky);outline-offset:3px}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.pill{border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:18px;padding:10px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pill .n{background:var(--line);border-radius:999px;padding:1px 9px;font-size:15px}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill[aria-pressed="true"] .n{background:rgba(255,255,255,.2)}
.search{width:100%;font:inherit;font-size:18px;padding:13px 18px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);margin-bottom:18px}
.search::placeholder{color:#a79fc4}
.views{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}
.views .chip{font-size:15px;padding:6px 12px}
.grp{grid-column:1/-1;margin:10px 0 -6px;font-size:20px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.grp:first-child{margin-top:0}
.grp small{font-size:15px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.book{border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px}
.cover{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#ffd6e8,#cfe6ff);box-shadow:0 12px 26px rgba(36,24,74,.16);transition:transform .15s}
.book:hover .cover{transform:translateY(-3px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.cover .stripe{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(36,24,74,.75));color:#fff;font-size:14px;font-weight:700;text-align:left}
.stars{font-size:18px;color:#d7cfee;letter-spacing:1px}
.stars .on{color:var(--sun)}
.bname{font-weight:800;font-size:17px;line-height:1.15;color:var(--ink)}
.bmeta{font-size:14px;color:var(--muted);margin-top:-4px}
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;border-radius:24px;background:#fff;border:2px dashed var(--line);color:var(--muted);font-size:20px}
dialog{border:0;border-radius:28px;padding:0;width:min(600px,calc(100% - 24px));background:#fff;color:var(--ink);box-shadow:0 30px 60px rgba(36,24,74,.3)}
dialog::backdrop{background:rgba(36,24,74,.4);backdrop-filter:blur(3px)}
.sheet{padding:24px}
.sheet h2{margin:0 0 2px;font-size:30px;font-weight:800}
.sheet .by{color:var(--muted);margin:0 0 14px;font-size:17px}
.sheet .lab{font-weight:800;font-size:16px;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:16px;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--mint);border-color:var(--mint);color:#fff}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:none;font-size:38px;cursor:pointer;color:#d7cfee;padding:0 2px;line-height:1}
.starpick button.on{color:var(--sun)}
.sheet textarea{width:100%;min-height:90px;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:18px;padding:10px 14px;color:var(--ink)}
.sheet .sum{font-size:16px;color:#4b4370;margin:10px 0 0}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.link{background:none;border:0;font:inherit;font-weight:800;color:var(--muted);cursor:pointer;padding:6px 0}
.close{border:0;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:18px;padding:11px 20px;border-radius:999px;cursor:pointer}
.sugg{display:flex;flex-direction:column;gap:6px;margin:-8px 0 10px}
.sugg button{border:0;text-align:left;cursor:pointer;font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:var(--g3);padding:10px 14px;border-radius:14px}
.sugg button small{display:block;color:var(--muted);font-size:14px;font-weight:600}
.hits{display:grid;gap:10px;margin:14px 0}
.hit{display:flex;gap:12px;align-items:center;border-radius:18px;padding:10px;background:var(--g3)}
.hit img{width:50px;height:74px;object-fit:cover;border-radius:10px;box-shadow:0 4px 10px rgba(36,24,74,.2)}
.hit div{flex:1;font-size:17px;line-height:1.2}
.hit small{color:var(--muted);font-size:14px}
.hit button{border:0;cursor:pointer;font:inherit;font-weight:800;color:#fff;padding:9px 16px;border-radius:999px;background:var(--mint)}
.readers{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rpill{border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:18px;padding:9px 16px;border-radius:999px;cursor:pointer}
.rpill.on{background:var(--pink);border-color:var(--pink);color:#fff}
.goalbox{background:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 6px 0 rgba(36,24,74,.08)}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.badge{display:flex;flex-direction:column;align-items:center;width:84px;padding:8px 4px;border-radius:18px;background:var(--g3);font-size:13px;font-weight:800;text-align:center}
.badge .e{font-size:28px;line-height:1.1}
.badge.locked{opacity:.35;filter:grayscale(1)}
.picked{background:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 6px 0 rgba(36,24,74,.08);margin-top:6px}
.picked-h{font-weight:800;font-size:20px;margin-bottom:10px}
.pickrow{border-top:2px dashed var(--line);padding:14px 0}
.pickrow:first-of-type{border-top:0;padding-top:4px}
.libby{font-weight:800;color:#fff;background:var(--sky);text-decoration:none;padding:11px 18px;border-radius:999px}
.foot2{margin:30px 0 0;text-align:center}
.foot2 button{background:none;border:0;font:inherit;font-size:15px;color:var(--muted);cursor:pointer;text-decoration:underline;padding:6px}
@media (max-width:520px){h1{font-size:32px}.brand .logo{width:46px;height:46px;font-size:24px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">📚</div><h1>My Books</h1></div>
    <div style="display:flex;gap:10px"><button class="pill" id="cardBtn" style="font-weight:800" aria-label="My reading card">🎴 My card</button><button class="add" id="addBtn" aria-label="Add a book">+ Add</button></div>
  </header>

  <div class="readers" id="readers" aria-label="Who's reading"></div>
  <div id="goal" style="margin:0 0 16px"></div>
  <div class="pills" role="group" aria-label="Shelves">
    <button class="pill" data-s="reading" aria-pressed="false">📖 Reading <span class="n" id="n-reading"></span></button>
    <button class="pill" data-s="read" aria-pressed="false">✅ Read <span class="n" id="n-read"></span></button>
    <button class="pill" data-s="tb" aria-pressed="false">📚 From the library <span class="n" id="n-tb"></span></button>
    <button class="pill" data-s="wish" aria-pressed="false">🎁 Someday <span class="n" id="n-wish"></span></button>
  </div>

  <input class="search" id="find" type="search" placeholder="Search the books already on your shelves" aria-label="Search the books already on your shelves">
  <div class="views" role="group" aria-label="Show books">
    <button class="chip" data-v="added">🆕 Newest</button>
    <button class="chip" data-v="az">🔤 A–Z</button>
    <button class="chip" data-v="author">✍️ By author</button>
    <button class="chip" data-v="year">🗓️ By year</button>
  </div>
  <div class="grid" id="list" aria-live="polite"></div>
  <div id="forYou" style="margin-top:22px"></div>


</main>

<dialog id="add">
  <div class="sheet">
    <h2>Find a new book</h2>
    <p class="by">Type the name of the book, or the number under the barcode.</p>
    <input class="search" id="q" type="search" placeholder="Book name or number" aria-label="Book name or number" autocomplete="off">
    <div class="sugg" id="sugg" aria-live="polite"></div>
    <div class="foot" style="margin-top:0">
      <label class="link" style="cursor:pointer">📷 Scan the barcode<input type="file" id="snap" accept="image/*" capture="environment" hidden></label>
      <label class="link" style="cursor:pointer">🧾 Read my library slip<input type="file" id="slip" accept="image/*" capture="environment" hidden></label>
      <button class="link" id="pasteList" style="cursor:pointer">📋 Paste a list</button>
      <button class="close" id="go">Find</button>
    </div>
    <p class="by" id="scanMsg" style="margin:6px 0 0"></p>
    <div class="hits" id="hits" aria-live="polite"></div>
    <div class="foot"><span></span><button class="link" id="closeAdd">Close</button></div>
  </div>
</dialog>

<dialog id="style">
  <div class="sheet">
    <h2>Make it yours</h2>
    <p class="by">Pick a background and a picture for your name.</p>
    <div class="lab">Background</div>
    <div class="chips" id="themeChoices"></div>
    <div class="lab">Picture</div>
    <div class="chips" id="avatarChoices"></div>
    <div class="foot"><span></span><button class="close" id="closeStyle">Done</button></div>
  </div>
</dialog>

<dialog id="card">
  <div class="sheet" id="cardBody"></div>
</dialog>

<dialog id="author">
  <div class="sheet" id="authorBody"></div>
</dialog>

<dialog id="detail">
  <div class="sheet" id="detailBody"></div>
</dialog>
<script>
const KEY = "hu_books_v1";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const LABEL = { reading: "Reading", read: "Read", tb: "From the library", wish: "Someday" };
let state = { shelf: "reading", q: "", sort: "added", books: [] };
const API = "https://miru.humanagency.co";
let readers = [];
function household() {
  let h = ""; try { h = localStorage.getItem("hu_household") || ""; } catch (e) {}
  if (!h) {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    h = [...a].map(x => x.toString(16).padStart(2, "0")).join("");
    try { localStorage.setItem("hu_household", h); } catch (e) {}
  }
  return h;
}
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json" } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
function currentReader() {
  let id = null; try { id = localStorage.getItem("hu_reader"); } catch (e) {}
  return readers.find(r => r.id === id) || readers[0];
}
function pickReader(id) { try { localStorage.setItem("hu_reader", id); } catch (e) {} renderReaders(); loadBooks(); }
const THEMES = {
  sunny: ["Sunny", ["#ffe9f3", "#e9f4ff", "#f3ecff"]],
  ocean: ["Ocean", ["#d9f6ff", "#c8f0ff", "#e6fbff"]],
  jungle: ["Jungle", ["#e4ffe6", "#f0ffe0", "#e9fff4"]],
  sunset: ["Sunset", ["#ffe3d1", "#ffd6e8", "#fff0d9"]],
  space: ["Space", ["#e3dcff", "#d6d0ff", "#f0edff"]],
  candy: ["Candy", ["#ffd9f0", "#e6d9ff", "#fff0fa"]],
};
const AVATARS = ["🙂", "🦊", "🐼", "🦄", "🐸", "🐯", "🦋", "🐙"];
function applyTheme(name) {
  const t = THEMES[name] || THEMES.sunny;
  document.body.style.setProperty("--g1", t[1][0]);
  document.body.style.setProperty("--g2", t[1][1]);
  document.body.style.setProperty("--g3", t[1][2]);
}
function openStyle() {
  const cur = currentReader(); if (!cur) return;
  const save = async body => {
    try { await api(`/api/books/readers/${cur.id}`, { method: "PATCH", body: JSON.stringify({ household: household(), ...body }) }); Object.assign(cur, body); applyTheme(cur.theme); renderReaders(); openStyle(); }
    catch (e) { alert("Couldn't save that. Try again."); }
  };
  $("themeChoices").innerHTML = Object.entries(THEMES).map(([k, [label]]) => `<button class="chip ${cur.theme === k ? "on" : ""}" data-theme="${k}">${label}</button>`).join("");
  $("avatarChoices").innerHTML = AVATARS.map(a => `<button class="chip ${cur.avatar === a ? "on" : ""}" data-avatar="${a}" style="font-size:24px;padding:4px 10px">${a}</button>`).join("");
  $("themeChoices").querySelectorAll("[data-theme]").forEach(b => b.onclick = () => save({ theme: b.dataset.theme }));
  $("avatarChoices").querySelectorAll("[data-avatar]").forEach(b => b.onclick = () => save({ avatar: b.dataset.avatar }));
  $("closeStyle").onclick = () => $("style").close();
  $("style").showModal();
}
function renderReaders() {
  // One reader per device. Tap the name to rename it; "Start again" is kept small, since it removes books.
  const cur = currentReader();
  if (!cur) { $("readers").innerHTML = ""; return; }
  applyTheme(cur.theme || "sunny");
  $("readers").innerHTML = `<button class="rpill on" id="renameReader" aria-label="Change name">${esc(cur.avatar || "🙂")} ${esc(cur.name)}'s books ✏️</button>
    <button class="link" id="styleBtn" style="font-size:14px;padding:6px 8px">🎨 Make it yours</button>
    <button class="link" id="linkDevice" style="font-size:14px;padding:6px 8px">📲 Use on another device</button>
    <button class="link" id="startAgain" style="font-size:14px;padding:6px 8px;color:var(--muted)">Start again</button>`;
  $("linkDevice").onclick = async () => {
    try {
      const d = await api("/api/books/link-code", { method: "POST", body: JSON.stringify({ household: household() }) });
      alert(`On the other device, open this page and choose "I have a code".\n\nCode: ${d.code}\n(It works for 10 minutes.)`);
    } catch (e) { alert("Couldn't make a code. Try again."); }
  };
  $("styleBtn").onclick = openStyle;
  $("renameReader").onclick = async () => {
    const n = (prompt("What's your name?", cur.name) || "").trim(); if (!n || n === cur.name) return;
    try { await api(`/api/books/readers/${cur.id}`, { method: "PATCH", body: JSON.stringify({ household: household(), name: n }) }); cur.name = n; renderReaders(); }
    catch (e) { alert("Couldn't change the name. Try again."); }
  };
  $("startAgain").onclick = async () => {
    if (!confirm(`Start again? This removes ${cur.name}'s books from this device.`)) return;
    try { await api(`/api/books/readers/${cur.id}?household=${household()}`, { method: "DELETE" }); readers = []; try { localStorage.removeItem("hu_reader"); } catch (e) {} showWelcome(); }
    catch (e) { alert("Couldn't start again. Try again."); }
  };
}
async function loadBooks() {
  const r = currentReader(); if (!r) { state.books = []; render(); return; }
  try {
    const rows = await api(`/api/books/list?household=${household()}&reader=${r.id}`);
    state.books = rows.map(x => ({ id: x.id, title: x.title, author: x.author, cover: x.cover, shelf: x.shelf, rating: x.rating,
      finished: x.finished || "", notes: x.notes || "", added: (x.added || "").slice(0, 10), book_id: x.book_id, due: x.due || "", summary: "" }));
  } catch (e) { state.books = []; }
  render();
}
async function syncBook(b) {
  const r = currentReader(); if (!r) return;
  const body = { household: household(), reader: r.id, title: b.title, author: b.author || "", cover: b.cover || "", shelf: b.shelf,
    rating: b.rating || 0, finished: b.finished || null, notes: b.notes || "", book_id: b.book_id || null, due: b.due || null };
  const isServerId = /^[0-9a-f-]{36}$/.test(b.id);
  if (isServerId) body.id = b.id;
  try {
    const row = await api("/api/books/list", { method: "POST", body: JSON.stringify(body) });
    if (!isServerId) { b.id = row.id; render(); }
  } catch (e) { alert("Couldn't save that. Check the connection and try again."); }
}
async function removeBook(b) {
  try { await api(`/api/books/list/${b.id}?household=${household()}`, { method: "DELETE" }); } catch (e) {}
  state.books = state.books.filter(x => x.id !== b.id); render();
}
async function migrateLocal(r) {
  let old = []; try { old = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
  for (const b of old) {
    await api("/api/books/list", { method: "POST", body: JSON.stringify({ household: household(), reader: r.id, title: b.title,
      author: b.author || "", cover: b.cover || "", shelf: b.shelf || "tb", rating: b.rating || 0, finished: b.finished || null,
      notes: b.notes || "", book_id: b.workKey || null }) }).catch(() => {});
  }
  try { localStorage.removeItem(KEY); } catch (e) {}
}
function showWelcome() {
  $("list").innerHTML = `<div class="empty" style="grid-column:1/-1"><p style="font-size:26px;font-weight:800;margin:0 0 12px">👋 Who's reading?</p>
    <input class="search" id="wname" placeholder="Type your name" aria-label="Your name" style="max-width:320px">
    <div><button class="rpill on" id="wgo">Let's go!</button></div>
    <p class="by" style="margin-top:14px"><button class="link" id="haveCode" style="font-size:16px">I have a code from another device</button></p></div>`;
  $("haveCode").onclick = async () => {
    const c = (prompt("Type the 6-digit code") || "").replace(/\D/g, ""); if (c.length !== 6) return;
    try {
      const d = await api("/api/books/link", { method: "POST", body: JSON.stringify({ code: c }) });
      try { localStorage.setItem("hu_household", d.household); } catch (e) {}
      readers = await api(`/api/books/readers?household=${d.household}`);
      if (!readers.length) { showWelcome(); return; }
      pickReader(readers[0].id);
    } catch (e) { alert(e.message || "That code didn't work. Try again."); }
  };
  $("wgo").onclick = async () => {
    const n = ($("wname").value || "").trim(); if (!n || $("wgo").disabled) return;
    $("wgo").disabled = true;   // ignore repeated taps while saving
    try {
      const r = await api("/api/books/readers", { method: "POST", body: JSON.stringify({ household: household(), name: n }) });
      readers.push(r); await migrateLocal(r); pickReader(r.id);
    } catch (e) { $("wgo").disabled = false; alert("Couldn't start. Check the connection and try again."); }
  };
}
// "Because you loved…": one row for each of her two top favourites (different authors), three books each
async function renderForYou() {
  const box = $("forYou"); if (!box) return;
  const liked = state.books.filter(b => b.shelf === "read" && (b.rating || 0) >= 4)
    .sort((a, b) => (b.rating - a.rating) || ((b.finished || "") > (a.finished || "") ? 1 : -1));
  if (!liked.length || state.shelf !== "read") { box.innerHTML = ""; return; }
  // Up to two favourites, each by a different author
  const picks = []; const authors = new Set();
  for (const b of liked) {
    const a = (b.author || b.title).toLowerCase();
    if (authors.has(a)) continue;
    authors.add(a); picks.push(b);
    if (picks.length === 2) break;
  }
  const have = new Set(state.books.map(b => (b.title || "").toLowerCase()));
  const rows = [];
  for (const fav of picks) {
    let hits = [];
    try {
      const r = await fetch(`https://${ALGOLIA_APP}-dsn.algolia.net/1/indexes/books/query`, {
        method: "POST",
        headers: { "X-Algolia-Application-Id": ALGOLIA_APP, "X-Algolia-API-Key": ALGOLIA_SEARCH_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ params: "query=" + encodeURIComponent(fav.author || fav.title) + "&restrictSearchableAttributes=author&hitsPerPage=100" }),
      });
      const d = await r.json();
      // Many editions share one title: show each title once, and skip anything she already has
      const seenTitles = new Set();
      hits = (d.hits || []).filter(h => {
        const t = (h.title || "").toLowerCase();
        if (!t || have.has(t) || seenTitles.has(t)) return false;

const STOP = new Set(["the","of","a","an","and","in","to","for","on","with","book"]);
function keyWords(q) { return q.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w && !STOP.has(w)); }
// Small typo allowance: "flies" matches "fleas", "pilky" matches "pilkey" (words of 4+ letters, 2 changes at most)
function editDistance(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 99;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function wordMatches(w, titleWords) {
  return titleWords.some(t => t === w || (w.length >= 4 && editDistance(w, t) <= 2));
}
// Fast search: our own catalogue in Supabase (public read-only key). Falls back to Open Library if nothing matches.

const SB_KEY = "sb_publishable_vRSr9xwsitkMPWVN1QcxNg_D-DlIvsM";
async function catalogueSearch(q) {

async function findBooks(q) {

async function openLibrarySearch(q) {
  q = q.trim(); if (q.length < 2) return [];
  const isbn = q.replace(/[^0-9Xx]/g, "");
  const fields = "key,title,author_name,first_publish_year,isbn,number_of_pages_median,subject,cover_i,publisher,edition_count";
  if (/^(\d{10}|\d{13})$/.test(isbn)) {
    const d = await (await fetch(`https://openlibrary.org/search.json?isbn=${isbn}&limit=5&fields=${fields}`)).json();
    return toBooks(d.docs || [], isbn);
  }
  const words = keyWords(q);
  const enc = encodeURIComponent(q);
  const first = encodeURIComponent(words.slice(0, 2).join(" ") || q);
  // Three searches: the whole phrase, the phrase as a general search, and the first words (to catch series)
  const urls = [
    `https://openlibrary.org/search.json?title=${enc}&sort=editions&limit=40&fields=${fields}`,
    `https://openlibrary.org/search.json?q=${enc}&sort=editions&limit=40&fields=${fields}`,
    `https://openlibrary.org/search.json?title=${first}&sort=editions&limit=100&fields=${fields}`,
    `https://openlibrary.org/search.json?q=${encodeURIComponent(words.slice(0, 3).join(" ") || q)}&limit=100&fields=${fields}`,
  ];
  const results = await Promise.all(urls.map(u => fetch(u).then(r => r.json()).catch(() => ({ docs: [] }))));
  const seen = new Set(); const docs = [];
  for (const r of results) for (const x of (r.docs || [])) {
    const k = (x.title || "").toLowerCase() + "|" + ((x.author_name || [])[0] || "");
    if (!seen.has(k)) { seen.add(k); docs.push(x); }
  }
  // Rank by how many of the typed words the title matches (allowing small typos)
  const hitsOf = x => { const tw = (x.title || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean); return words.filter(w => wordMatches(w, tw)).length; };
  const need = Math.max(1, Math.ceil(words.length / 2));
  const ranked = docs.map(x => ({ x, h: hitsOf(x) })).filter(o => o.h >= need)
    .sort((a, b) => (b.h - a.h) || ((b.x.edition_count || 0) - (a.x.edition_count || 0)));
  return toBooks(ranked.slice(0, 8).map(o => o.x), "");
}
function toBooks(docs, isbnQuery) {
  return docs.map(x => ({
    title: x.title || "Untitled", author: (x.author_name || [])[0] || "Unknown author",
    year: x.first_publish_year || "", pages: x.number_of_pages_median || "",
    isbn: (x.isbn || []).find(i => i.length === 13) || (x.isbn || [])[0] || isbnQuery,
    genres: (x.subject || []).slice(0, 4), publisher: (x.publisher || [])[0] || "",
    cover: x.cover_i ? `https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg` : "",
    workKey: x.key || ""

}

// What shows on the grid: the chosen shelf, filtered by search, newest first
function visible() {
  const q = state.q.toLowerCase();
  let list = state.books.filter(b => b.shelf === state.shelf);
  if (q) {
    // Every word typed must match something in the title, author or notes (small typos allowed)
    const words = q.split(/\s+/).filter(w => w && !STOP.has(w));
    list = list.filter(b => {
      const hay = [b.title, b.author, b.notes, yearOf(b)].join(" ").toLowerCase();
      const hayWords = hay.replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
      return words.every(w => hay.includes(w) || (!/^\d+$/.test(w) && wordMatches(w, hayWords)));   // years must match exactly
    });
  }
  const newest = (a, b) => ((b.finished || b.added || "") > (a.finished || a.added || "") ? 1 : -1);
  if (state.sort === "az") return list.sort((a, b) => sortTitle(a).localeCompare(sortTitle(b)));
  if (state.sort === "author") return list.sort((a, b) => surname(a.author).localeCompare(surname(b.author)) || sortTitle(a).localeCompare(sortTitle(b)));
  return list.sort(newest);
}
// Helpers for the views: the year she read it (or added it), and names to sort by
function yearOf(b) { return (b.finished || b.added || "").slice(0, 4); }
function sortTitle(b) { return (b.title || "").replace(/^(the|a|an)\s+/i, "").toLowerCase(); }
function surname(a) { return (a || "").trim().split(/\s+/).pop().toLowerCase(); }
// Author and year views: the same books, under a heading for each author or year
function groupsOf(list) {
  if (state.sort !== "author" && state.sort !== "year") return null;
  const key = b => state.sort === "year" ? (yearOf(b) || "Not sure when") : (b.author || "Unknown author");
  const groups = new Map();
  for (const b of list) { const k = key(b); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); }
  const out = [...groups.entries()];
  if (state.sort === "year") out.sort((a, b) => (/^\d/.test(b[0]) - /^\d/.test(a[0])) || b[0].localeCompare(a[0]));
  else out.sort((a, b) => (b[1].length - a[1].length) || surname(a[0]).localeCompare(surname(b[0])));
  return out;
}

  const groups = groupsOf(list);
  $("list").innerHTML = list.length
    ? (groups ? groups.map(([name, books]) => `<h3 class="grp">${esc(name)} <small>${books.length} ${books.length === 1 ? "book" : "books"}</small></h3>` + books.map(card).join("")).join("")
              : list.map(card).join(""))
    : `<div class="empty" style="grid-column:1/-1">${state.books.some(b => b.shelf === state.shelf) ? "Nothing matches your search." : "No books here yet. Tap the big + Add button to add your first one! 🎉"}</div>`;
  $("list").querySelectorAll("[data-open]").forEach(btn => btn.onclick = () => openDetail(btn.dataset.open));
  renderForYou();
  renderGoal();
}

function openDetail(id) {
  const b = state.books.find(x => x.id === id); if (!b) return;
  const shelfBtns = ["reading","read","tb","wish"].map(k => `<button class="chip ${b.shelf === k ? "on" : ""}" data-to="${k}">${LABEL[k]}</button>`).join("");
  const rate = [1,2,3,4,5].map(n => `<button data-rate="${n}" class="${n <= (b.rating || 0) ? "on" : ""}" aria-label="${n} stars">★</button>`).join("");
  $("detailBody").innerHTML = `
    <h2>${esc(b.title)}</h2>
    <p class="by"><button class="link" id="authorLink" style="padding:0;text-decoration:underline">${esc(b.author)}</button>${b.year ? " · " + esc(b.year) : ""}${b.pages ? " · " + esc(b.pages) + " pages" : ""}</p>
    ${b.summary ? `<p class="sum">${esc(b.summary.slice(0, 400))}${b.summary.length > 400 ? "…" : ""}</p>` : ""}
    <div class="lab">Shelf</div>
    <div class="chips">${shelfBtns}</div>
    <div class="lab">My rating</div>
    <div class="starpick">${rate}</div>
    ${b.shelf === "tb" ? `<div class="lab">Due back</div><input class="search" type="date" id="due" value="${esc(b.due)}" style="max-width:240px">` : ""}
    ${b.shelf === "read" ? `<div class="lab">Finished on</div><input class="search" type="date" id="fin" value="${esc(b.finished)}" style="max-width:240px">` : ""}
    <div class="lab">What did you think?</div>
    <textarea id="notes" placeholder="Write it here…">${esc(b.notes)}</textarea>
    <div class="foot"><button class="link" id="del">Remove this book</button></div>
    <div class="foot" style="margin-top:12px"><span></span><button class="close" id="done">Done</button></div>`;
  const change = fn => { fn(b); syncBook(b); openDetail(id); render(); };
  $("detailBody").querySelectorAll("[data-to]").forEach(btn => btn.onclick = () => change(x => { x.shelf = btn.dataset.to; if (x.shelf === "read" && !x.finished) x.finished = today(); }));
  $("detailBody").querySelectorAll("[data-rate]").forEach(btn => btn.onclick = () => change(x => { x.rating = +btn.dataset.rate; if (x.shelf === "reading" || x.shelf === "tb") { x.shelf = "read"; x.finished = x.finished || today(); } }));
  if ($("fin")) $("fin").onchange = () => change(x => x.finished = $("fin").value);
  if ($("due")) $("due").onchange = () => change(x => x.due = $("due").value);
  $("notes").onchange = () => { b.notes = $("notes").value; syncBook(b); };
  $("del").onclick = () => { if (confirm("Remove this book?")) { $("detail").close(); removeBook(b); } };
  $("done").onclick = () => { b.notes = $("notes").value; syncBook(b); $("detail").close(); render(); };
  $("authorLink").onclick = () => { if (b.author && b.author !== "Unknown author") openAuthor(b.author); };
  $("detail").showModal();
}

document.querySelectorAll(".pills button").forEach(b => b.onclick = () => { state.shelf = b.dataset.s; render(); });
$("addBtn").onclick = () => { $("hits").innerHTML = ""; $("scanMsg").textContent = ""; $("add").showModal(); $("q").focus(); };
$("closeAdd").onclick = () => $("add").close();
$("go").onclick = async () => {
  $("hits").innerHTML = "<p>Looking…</p>";
  try { showHits(await findBooks($("q").value)); } catch (e) { $("hits").innerHTML = "<p>Search isn't working right now. Try again in a moment.</p>"; }
};
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("sugg").innerHTML = ""; $("go").click(); } });
// Suggestions as she types: quick catalogue lookup after a short pause
let suggTimer = null;
$("q").addEventListener("input", () => {
  clearTimeout(suggTimer);
  const term = $("q").value.trim();
  if (term.length < 3 || /^\d+$/.test(term)) { $("sugg").innerHTML = ""; return; }
  suggTimer = setTimeout(async () => {
    try {
      const list = (await algoliaSearch(term, 6)) || (await catalogueSearch(term)) || [];
      if ($("q").value.trim() !== term) return;   // she has typed on; ignore stale results
      $("sugg").innerHTML = list.slice(0, 6).map((b, i) => `<button data-sg="${i}">${esc(b.title)}<small>${esc(b.author)}</small></button>`).join("");
      $("sugg").querySelectorAll("[data-sg]").forEach(btn => btn.onclick = () => {
        $("sugg").innerHTML = ""; $("q").value = list[+btn.dataset.sg].title; showHits([list[+btn.dataset.sg]]);
      });
    } catch (e) { $("sugg").innerHTML = ""; }
  }, 250);
});
// Scan: take a photo of the barcode; the server reads the number, then we search for it
const SCAN_API = "https://miru.humanagency.co/api/scan-barcode";
// Library slip: read the titles and due dates from a photo, she ticks the ones to add
$("slip").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("scanMsg").textContent = "Reading the slip…";
  try {
    const body = new FormData(); body.append("image", f);
    const r = await fetch(`${API}/api/books/read-slip`, { method: "POST", body });
    const d = await r.json();
    if (!r.ok) { $("scanMsg").textContent = d.error || "Couldn't read that slip."; }
    else if (!d.books.length) { $("scanMsg").textContent = "No books found on that slip. Try a clearer photo."; }
    else {
      $("scanMsg").textContent = "Tick the books to add to From the library:";
      $("hits").innerHTML = d.books.map((b, i) => `<label class="hit"><input type="checkbox" checked data-slip="${i}" style="width:22px;height:22px">
        <div><b>${esc(b.title)}</b><br><small>${esc(b.author || "")}${b.due ? " · Due back " + esc(b.due) : ""}</small></div></label>`).join("")
        + `<button id="addSlip">Add the ticked books</button>`;
      $("addSlip").onclick = async () => {
        const ticked = [...$("hits").querySelectorAll("[data-slip]")].filter(x => x.checked).map(x => d.books[+x.dataset.slip]);
        for (const b of ticked) {
          state.books.unshift({ id: String(Date.now() + Math.random()), title: b.title, author: b.author || "", cover: "", shelf: "tb",
            rating: 0, finished: "", notes: "", added: today(), due: b.due || "", summary: "" });
          await syncBook(state.books[0]);
        }
        $("add").close(); $("hits").innerHTML = ""; $("scanMsg").textContent = ""; state.shelf = "tb"; render();
        celebrate(`${ticked.length} books added to From the library 📚`);
      };
    }
  } catch (err) { $("scanMsg").textContent = "The slip reader isn't available right now."; }
  e.target.value = "";
};
$("snap").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("scanMsg").textContent = "Reading the barcode…";
  try {
    const body = new FormData(); body.append("image", f);
    const d = await (await fetch(SCAN_API, { method: "POST", body })).json();
    if (d.barcode) { $("scanMsg").textContent = "Found " + d.barcode; $("q").value = d.barcode; $("go").click(); }
    else { $("scanMsg").textContent = "Couldn't read that barcode. Try a closer, straighter photo, or type the number."; }
  } catch (err) { $("scanMsg").textContent = "The scanner isn't available right now. Type the number instead."; }
  e.target.value = "";
};
// Find a cover for a book we only know by title and author. Only takes a cover when the title words
// and the author's surname both match, so a near miss leaves the placeholder rather than a wrong picture.
async function findCover(title, author) {
  const main = title.replace(/\(book \d+\)/i, " ");
  const want = keyWords(main);
  const surname = (author || "").trim().split(/\s+/).pop().toLowerCase();
  const fits = (t, a) => {
    if (!t) return false;
    const tw = t.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
    const hit = want.filter(w => wordMatches(w, tw)).length;
    return want.length && hit >= Math.ceil(want.length * 0.75) && (!surname || (a || "").toLowerCase().includes(surname));
  };
  try {
    const hits = (await algoliaSearch(main + " " + (author || ""), 8)) || [];
    const h = hits.find(x => x.cover && fits(x.title, x.author));
    if (h) return h.cover;
  } catch (e) {}
  try {
    const u = `https://openlibrary.org/search.json?title=${encodeURIComponent(main)}&author=${encodeURIComponent(author || "")}&limit=10&fields=title,author_name,cover_i`;
    const d = await (await fetch(u)).json();
    const x = (d.docs || []).find(x => x.cover_i && fits(x.title, (x.author_name || []).join(" ")));
    if (x) return `https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg`;
  } catch (e) {}
  return "";
}
// Paste a list: one book per line, "Title ~ Author" (a tab or " by " works too). Lots of books in one go.
// An optional third part picks the shelf for that line: reading, read, library or someday.
const SHELF_WORDS = { reading: "reading", read: "read", library: "tb", "from the library": "tb", tb: "tb", someday: "wish", wish: "wish" };
function parseList(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let parts = l.split(/\s*[~\t|]\s*/);
    if (parts.length === 1 && / by /i.test(l)) parts = l.split(/ by /i);
    const [title, author = "", shelf = ""] = parts.map(p => p.trim());
    return { title, author, shelf: SHELF_WORDS[shelf.toLowerCase()] || "" };
  }).filter(b => b.title);
}
$("pasteList").onclick = () => {
  let shelf = "read";
  $("sugg").innerHTML = "";
  $("scanMsg").textContent = "One book per line: Title ~ Author";
  $("hits").innerHTML = `<textarea id="bulkText" class="search" rows="8" style="min-height:160px;font-size:16px"
      placeholder="The Wild Robot ~ Peter Brown&#10;Matilda ~ Roald Dahl"></textarea>
    <div class="lab" style="font-weight:800">Put them on</div>
    <div class="chips" id="bulkShelf">${["reading","read","tb","wish"].map(k => `<button class="chip ${k === shelf ? "on" : ""}" data-bs="${k}">${LABEL[k]}</button>`).join("")}</div>
    <button id="bulkGo" class="add" style="margin-top:6px">Add these books</button>`;
  $("bulkShelf").querySelectorAll("[data-bs]").forEach(b => b.onclick = () => {
    shelf = b.dataset.bs;
    $("bulkShelf").querySelectorAll("[data-bs]").forEach(x => x.classList.toggle("on", x === b));
  });
  $("bulkGo").onclick = async () => {
    const r = currentReader(); if (!r) return;
    const have = new Set(state.books.map(b => b.title.trim().toLowerCase()));
    const list = parseList($("bulkText").value);
    const todo = list.filter(b => { const k = b.title.toLowerCase(); if (have.has(k)) return false; have.add(k); return true; });
    if (!todo.length) { $("scanMsg").textContent = list.length ? "They're all on your shelves already." : "Type or paste some books first."; return; }
    $("bulkGo").disabled = true;
    let done = 0, failed = 0;
    for (const b of todo) {
      $("scanMsg").textContent = `Adding ${done + failed + 1} of ${todo.length}…`;
      const s = b.shelf || shelf;
      try {
        const cover = await findCover(b.title, b.author);
        const row = await api("/api/books/list", { method: "POST", body: JSON.stringify({ household: household(), reader: r.id,
          title: b.title, author: b.author, cover, shelf: s, rating: 0, finished: null, notes: "", book_id: null, due: null }) });
        state.books.unshift({ id: row.id, title: b.title, author: b.author, cover, shelf: s, rating: 0, finished: "", notes: "",
          added: today(), due: "", summary: "" });
        done++;
      } catch (e) { failed++; }
    }
    $("add").close(); $("hits").innerHTML = ""; $("scanMsg").textContent = ""; state.shelf = shelf; render();
    const skipped = list.length - todo.length;
    celebrate(`${done} books added 📚` + (skipped ? ` (${skipped} already there)` : "") + (failed ? ` · ${failed} didn't save, try those again` : ""));
  };
};
$("find").oninput = e => { state.q = e.target.value; render(); };
// Remember the chosen view on this device
try { state.sort = localStorage.getItem("hu_view") || "added"; } catch (e) {}
document.querySelectorAll(".views [data-v]").forEach(b => b.onclick = () => {
  state.sort = b.dataset.v; try { localStorage.setItem("hu_view", state.sort); } catch (e) {} render();
});

init();
</script>
